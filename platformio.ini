[platformio]
; optional: nur diese bauen bei bloßem `pio run`
; default_envs = CAI_MINI_LORA_SENSOR_HW2, CAI_MINI_LORA_ROUTER_HW2

[common]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags = -Iinclude

lib_common =
    stevemarple/IniFile@^1.3.0
    thingsboard/ThingsBoard@^0.15.0
    thingsboard/TBPubSubClient@^2.12.1
    bblanchon/ArduinoJson@^6.21.4
lib_bme =
    adafruit/Adafruit BME680 Library
    adafruit/Adafruit Unified Sensor
lib_lora =
    jgromes/RadioLib @ 6.6.0
    rweather/Crypto
    agdl/Base64


; ---------- WLAN ----------
[wlan_base]
extends = common
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<WLAN/>
build_flags = ${common.build_flags} -DDEVICE_WLAN
lib_deps =
    SPI
    FS
    SD
    ${common.lib_common}
    ${common.lib_bme}

[env:CAI_MINI_WLAN_HW1]
extends = wlan_base
build_flags = ${wlan_base.build_flags} -DHW_VERSION=1

[env:CAI_MINI_WLAN_HW2]
extends = wlan_base
build_flags = ${wlan_base.build_flags} -DHW_VERSION=2


; ---------- WIND ----------
[wind_base]
extends = common
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<WIND/>
build_flags = ${common.build_flags} -DDEVICE_WIND
lib_deps =
    SPI
    FS
    SD
    ${common.lib_common}
    ${common.lib_bme}


[env:CAI_MINI_WIND_HW1]
extends = wind_base
build_flags = ${wind_base.build_flags} -DHW_VERSION=1

[env:CAI_MINI_WIND_HW2]
extends = wind_base
build_flags = ${wind_base.build_flags} -DHW_VERSION=2


; ---------- LORA SENSOR ----------
[sensor_base]
extends = common
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<LORA_SENSOR/>
build_flags = ${common.build_flags} -DDEVICE_SENSOR
lib_deps =
    ${common.lib_common}
    ${common.lib_bme}
    ${common.lib_lora}

[env:CAI_MINI_LORA_SENSOR_HW1]
extends = sensor_base
build_flags = ${sensor_base.build_flags} -DHW_VERSION=1

[env:CAI_MINI_LORA_SENSOR_HW2]
extends = sensor_base
build_flags = ${sensor_base.build_flags} -DHW_VERSION=2


; ---------- LORA ROUTER ----------
[router_base]
extends = common
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<LORA_ROUTER/>
build_flags = ${common.build_flags} -DDEVICE_ROUTER
lib_deps =
    ${common.lib_common}
    ${common.lib_bme}
    ${common.lib_lora}

[env:CAI_MINI_LORA_ROUTER_HW1]
extends = router_base
build_flags = ${router_base.build_flags} -DHW_VERSION=1

[env:CAI_MINI_LORA_ROUTER_HW2]
extends = router_base
build_flags = ${router_base.build_flags} -DHW_VERSION=2


; ---------- LORA GATEWAY ----------
[gateway_base]
extends = common
build_src_filter = -<*> +<LORA_GATEWAY/>
build_flags = ${common.build_flags} -DDEVICE_GATEWAY -DLOG_TELNET
lib_deps =
    ${common.lib_common}
    ${common.lib_lora}
    jandrassy/TelnetStream@^1.3.0

; XIAO-Gateway: bekommt HW-Achse
[gateway_xiao_base]
extends = gateway_base
board = seeed_xiao_esp32s3
build_flags = ${gateway_base.build_flags} -DSEED_XIAO_ESP32S3

[env:CAI_MINI_LORA_GATEWAY_XIAO_S3_HW1]
extends = gateway_xiao_base
build_flags = ${gateway_xiao_base.build_flags} -DHW_VERSION=1

[env:CAI_MINI_LORA_GATEWAY_XIAO_S3_HW2]
extends = gateway_xiao_base
build_flags = ${gateway_xiao_base.build_flags} -DHW_VERSION=2

; Heltec-Gateway: bleibt einzeln, keine HW-Achse
[env:CAI_MINI_LORA_GATEWAY_HELTEC_WIRELESS_STICK_LITE_V3]
extends = gateway_base
board = heltec_wifi_lora_32_V3
build_flags = ${gateway_base.build_flags} -DHELTEC_WSL_V3
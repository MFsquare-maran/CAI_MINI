; ============================================================
;  CAI_MINI  ·  INIT.ini  —  LoRa Gateway
; ------------------------------------------------------------
;  Empfaengt LoRa-Pakete und leitet sie per WLAN/MQTT an TB.
;
;  >>> WICHTIG <<<
;  Die aktuelle Gateway-Firmware liest ihre Zugangsdaten aus
;  src/LORA_GATEWAY/credentials.h (compile-time), NICHT aus
;  dieser INI. Diese Datei dient nur als Vorlage/Referenz,
;  falls das Gateway spaeter auf INI-Config umgestellt wird.
;
;  Regeln : Schluessel case-sensitive, KEIN Leerzeichen um '='.
;           Kommentare nur auf eigener Zeile (mit ';').
; ============================================================

[GENERAL]
; Intervall fuer den Gateway-Status (Attribute/OTA), in Minuten
SENDING_PERIOD=10

[ID]
; Eigener Name des Gateways (Ziel-Name der Router/Sensoren)
NAME=GATEWAY01

[WIFI]
SSID=MeinNetzwerk
PW=MeinPasswort

[THINGSBOARD]
; Access-Token des Gateway-Devices in ThingsBoard
TB_ADRESS=iot.mfsquare.ch
TB_TOKKEN=mein-access-token
TB_PORT=1884
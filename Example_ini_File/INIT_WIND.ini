; ============================================================
;  CAI_MINI  ·  INIT.ini  —  WIND-Modus
; ------------------------------------------------------------
;  BME680 + Windfahne + Anemometer + Regenmesser
;  -> WLAN/MQTT -> ThingsBoard (Dauerbetrieb)
;
;  Ablage : als  /INIT.ini  ins Root der SD-Karte kopieren.
;  Regeln : Schluessel case-sensitive, KEIN Leerzeichen um '='.
;           Kommentare nur auf eigener Zeile (mit ';').
; ============================================================

[GENERAL]
; Sendeintervall in Minuten
SENDING_PERIOD=10

[WIFI]
SSID=MeinNetzwerk
PW=MeinPasswort

[THINGSBOARD]
TB_ADRESS=iot.mfsquare.ch
TB_TOKKEN=mein-access-token
TB_PORT=1884

[BME680]
; Kalibrier-Offsets fuer den Umweltsensor
TEMPERATURE_OFFSET=-2.05
PRESSURE_OFFSET=0.0
HUMINITY_OFFSET=0.0
GAS_OFFSET=0.0

[WIND]
; Geraeteausrichtung in Grad (0 = Norden, 90 = Osten, ...)
DEVICE_DIRECTION=0.0
; Offset auf die berechnete Windrichtung
WIND_VANE_OFFSET=0.0
; Offset auf die berechnete Windgeschwindigkeit (m/s)
WIND_SPEED_OFFSET=0.0

[RAIN]
; Offset auf die Regenmenge (mm)
RAIN_OFFSET=0.0

[WINDADCVALUES]
; 1 = ADC-Rohwert der Windfahne per Seriell ausgeben (Kalibrier-Modus)
WIND_Direction_TEST=0
; ADC-Stuetzpunkte 0..15 (je 22.5 Grad) — pro Geraet einmessen!
0=2937
1=1464
2=1682
3=274
4=312
5=210
6=645
7=431
8=1021
9=861
10=2322
11=2201
12=3782
13=3125
14=3435
15=2603
; ============================================================
;  CAI_MINI  ·  INIT.ini  —  LoRa Sensor
; ------------------------------------------------------------
;  BME680 -> LoRa -> Router/Gateway
;
;  Ablage : als  /INIT.ini  ins Root der SD-Karte kopieren.
;  Regeln : Schluessel case-sensitive, KEIN Leerzeichen um '='.
;           Kommentare nur auf eigener Zeile (mit ';').
; ============================================================

[GENERAL]
; Sendeintervall in Minuten
SENDING_PERIOD=10

[ID]
; Eigener Name dieses Geraets
NAME=SENSOR01

[SEND_TO]
; Naechster Hop: Name des Routers oder Gateways
NAME=ROUTER01

[THINGSBOARD]
; TB_TOKKEN wird in die LoRa-Payload eingebettet — der Gateway
; nutzt es, um die Daten dem richtigen TB-Device zuzuordnen.
; TB_ADRESS / TB_PORT nur noetig, wenn der Sensor selbst per
; WLAN OTA-Updates zieht (siehe optionale [WIFI]-Section).
TB_ADRESS=iot.mfsquare.ch
TB_TOKKEN=mein-access-token
TB_PORT=1884

[BME680]
TEMPERATURE_OFFSET=-2.05
PRESSURE_OFFSET=0.0
HUMINITY_OFFSET=0.0
GAS_OFFSET=0.0

; --- Optional: WLAN nur fuer OTA-Firmware-Updates ---
; Ohne [WIFI] laeuft der Sensor rein ueber LoRa (kein OTA).
[WIFI]
SSID=MeinNetzwerk
PW=MeinPasswort
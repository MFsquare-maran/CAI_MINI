; ============================================================
;  CAI_MINI  ·  INIT.ini  —  LoRa Router
; ------------------------------------------------------------
;  Empfaengt LoRa-Pakete, haengt RSSI an und leitet sie weiter.
;  Sendet zusaetzlich ein eigenes BME680-Paket.
;
;  Ablage : als  /INIT.ini  ins Root der SD-Karte kopieren.
;  Regeln : Schluessel case-sensitive, KEIN Leerzeichen um '='.
;           Kommentare nur auf eigener Zeile (mit ';').
; ============================================================

[GENERAL]
; Intervall fuer das eigene Paket, in Minuten
SENDING_PERIOD=10

[ID]
; Eigener Name dieses Geraets
NAME=ROUTER01

[SEND_TO]
; Naechster Hop: Name des Gateways (oder naechsten Routers)
NAME=GATEWAY01

[THINGSBOARD]
; Token fuers eigene Paket; TB_ADRESS/TB_PORT nur fuer OTA noetig.
TB_ADRESS=iot.mfsquare.ch
TB_TOKKEN=mein-access-token
TB_PORT=1884

[BME680]
TEMPERATURE_OFFSET=-2.05
PRESSURE_OFFSET=0.0
HUMINITY_OFFSET=0.0
GAS_OFFSET=0.0

; --- Optional: WLAN nur fuer OTA-Firmware-Updates ---
; Ohne [WIFI] laeuft der Router rein ueber LoRa (kein OTA).
[WIFI]
SSID=MeinNetzwerk
PW=MeinPasswort
; ============================================================
;  CAI_MINI  ·  INIT.ini  —  WLAN-Modus
; ------------------------------------------------------------
;  BME680 -> WLAN/MQTT -> ThingsBoard (Single-Shot)
;
;  Ablage : als  /INIT.ini  ins Root der SD-Karte kopieren.
;  Regeln : Schluessel case-sensitive, KEIN Leerzeichen um '='.
;           Kommentare nur auf eigener Zeile (mit ';').
; ============================================================

[GENERAL]
; Deep-Sleep-Intervall in Minuten (nur HW2 relevant)
SENDING_PERIOD=10

[WIFI]
SSID=MeinNetzwerk
PW=MeinPasswort

[THINGSBOARD]
TB_ADRESS=iot.mfsquare.ch
TB_TOKKEN=mein-access-token
TB_PORT=1884

[BME680]
; Kalibrier-Offsets, werden auf den Rohmesswert addiert
TEMPERATURE_OFFSET=-2.05
PRESSURE_OFFSET=0.0
HUMINITY_OFFSET=0.0
GAS_OFFSET=0.0

; --- Optional: Home Assistant (MQTT Discovery) ---
; Fehlt HA_BROKER, wird der HA-Teil komplett uebersprungen.
[HOMEASSISTANT]
HA_BROKER=192.168.2.11
HA_PORT=1883
HA_DEVICE_ID=CAI-Mini-00
HA_USER=meinuser
HA_PASS=meinpass